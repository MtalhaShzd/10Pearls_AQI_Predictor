name: Hourly Feature Pipeline

on:
  schedule:
    - cron: "23 * * * *"      # :15 gives Open-Meteo time to publish the hour
  workflow_dispatch:
    inputs:
      past_days:
        description: "Days of history to fetch (1-92). Use ~30 to close a gap."
        required: false
        default: "3"

permissions:
  contents: write             

concurrency:
  group: aqi-data-write       
  cancel-in-progress: false

jobs:
  run-hourly-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      HOPSWORKS_HOST: eu-west.cloud.hopsworks.ai
      HOPSWORKS_PROJECT: internship10P
      HOPSWORKS_FEATURE_GROUP: lahore_air_quality_features
      HOPSWORKS_FEATURE_GROUP_VERSION: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt       

      - name: Verify streaming dependencies
        run: python -c "import confluent_kafka, fastavro; print('kafka deps OK')"

      - name: Run hourly feature pipeline
        run: |
          python scripts/feature_pipeline.py \
            --past-days "${{ inputs.past_days || '3' }}"

      - name: Commit updated CSV
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/lahore/lahore_features_hourly.csv

          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "chore: hourly data update $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"

          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep $((5 * i))
          done
          echo "::error::Failed to push after 3 attempts"
          exit 1
