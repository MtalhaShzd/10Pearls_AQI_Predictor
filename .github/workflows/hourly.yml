name: Hourly Feature Pipeline

on:
  schedule:
    # Runs every hour at minute 0
    - cron: "0 * * * *"
  workflow_dispatch:  # Allows manual trigger from GitHub UI
  push:
    branches: [main]

jobs:
  run-hourly-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file
        run: |
          echo "HOPSWORKS_API_KEY=${{ secrets.HOPSWORKS_API_KEY }}" >> .env
          echo "HOPSWORKS_PROJECT=internship10P" >> .env

      - name: Run hourly feature pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: python scripts/feature_pipeline.py

      - name: Check for CSV changes
        id: check_changes
        run: |
          if [ -f data/processed/lahore/lahore_features_hourly.csv ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "CSV exists, will commit if changed"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No CSV found, skipping commit"
          fi

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage the updated hourly data
          git add data/processed/lahore/lahore_features_hourly.csv
          
          # If data changed: commit, rebase-pull remote commits, and push
          if ! git diff --staged --quiet; then
            git commit -m "chore: hourly data update $(date -u +'%Y-%m-%d %H:%M:%S UTC') [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          else
            echo "No data changes to commit."
          fi
