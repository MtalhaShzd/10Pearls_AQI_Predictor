name: Daily Training Pipeline

on:
  schedule:
    - cron: "0 2 * * *"       # 02:00 UTC = 07:00 Lahore
  workflow_dispatch:
    inputs:
      source:
        description: "Data source"
        type: choice
        options: [auto, hopsworks, csv]
        default: auto
      force_register:
        description: "Register even if metrics did not improve"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: aqi-train
  cancel-in-progress: false

jobs:
  run-daily-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      HOPSWORKS_HOST: eu-west.cloud.hopsworks.ai
      HOPSWORKS_PROJECT: internship10P
      HOPSWORKS_FEATURE_GROUP: lahore_air_quality_features
      HOPSWORKS_FEATURE_GROUP_VERSION: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt

      #  Training reads from Hopsworks by default,
      # so a missing CSV is no longer a fatal condition.
      - name: Report local data status
        run: |
          F=data/processed/lahore/lahore_features_hourly.csv
          if [ -f "$F" ]; then
            echo "Local CSV present: $(wc -l < $F) lines"
          else
            echo "No local CSV - will read from the feature store"
          fi

      - name: Run daily training pipeline
        run: |
          ARGS="--source ${{ inputs.source || 'auto' }}"
          if [ "${{ inputs.force_register }}" != "true" ]; then
            ARGS="$ARGS --only-if-better"      # FIX #3 - stops version sprawl
          fi
          echo "python scripts/training_pipeline.py $ARGS"
          python scripts/training_pipeline.py $ARGS

      - name: Commit model metadata
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The .pkl lives in the Hopsworks Model Registry and is gitignored.
          # Only commit the small JSON metadata, skipping anything ignored.
          for f in models/metrics.json models/feature_columns.json; do
            if [ -f "$f" ] && ! git check-ignore -q "$f"; then
              git add "$f"
            else
              echo "Skipping $f (missing or gitignored)"
            fi
          done

          if git diff --staged --quiet; then
            echo "No metadata changes to commit."
            exit 0
          fi

          git commit -m "chore: daily model retrain $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"

          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep $((5 * i))
          done
          echo "::error::Failed to push after 3 attempts"
          exit 1
