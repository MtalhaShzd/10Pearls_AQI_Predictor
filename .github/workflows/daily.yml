name: Daily Training Pipeline

on:
  schedule:
    # Runs every day at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "models/**"
      - "*.md"

permissions:
  contents: write

jobs:
  run-daily-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file
        run: |
          echo "HOPSWORKS_API_KEY=${{ secrets.HOPSWORKS_API_KEY }}" >> .env
          echo "HOPSWORKS_PROJECT=internship10P" >> .env

      - name: Check if training data exists
        run: |
          if [ ! -f data/processed/lahore/lahore_features_hourly.csv ]; then
            echo "❌ No training data found."
            echo "Please run the hourly pipeline first to generate data."
            exit 1
          fi
          echo "✅ Training data found"

      - name: Run daily training pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: python scripts/training_pipeline.py

      - name: Commit updated model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add models/
          git diff --staged --quiet || git commit -m "chore: daily model retrain $(date -u +'%Y-%m-%d %H:%M:%S UTC') [skip ci]"
          git push origin main
