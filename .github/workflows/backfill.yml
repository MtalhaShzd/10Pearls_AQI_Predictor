name: Backfill Pipeline
on:
  schedule:
    - cron: "40 */6 * * *"   
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start YYYY-MM-DD (blank = auto-detect gaps)"
        required: false
        default: ""
      end_date:
        description: "End YYYY-MM-DD (required if start is set)"
        required: false
        default: ""
      no_upload:
        description: "Dry run - CSV only, skip Hopsworks"
        type: boolean
        default: false
      full_upload:
        description: "Re-send every row (slow, ~22k rows)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: aqi-data-write       # same group as hourly - they share the CSV
  cancel-in-progress: false

jobs:
  run-backfill-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60       # full recompute + materialization can be slow

    env:
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      HOPSWORKS_HOST: eu-west.cloud.hopsworks.ai
      HOPSWORKS_PROJECT: internship10P
      HOPSWORKS_FEATURE_GROUP: lahore_air_quality_features
      HOPSWORKS_FEATURE_GROUP_VERSION: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Validate inputs
        run: |
          S="${{ inputs.start_date }}"; E="${{ inputs.end_date }}"
          if [ -n "$S" ] && [ -z "$E" ]; then
            echo "::error::end_date is required when start_date is set"; exit 1
          fi
          if [ -z "$S" ] && [ -n "$E" ]; then
            echo "::error::start_date is required when end_date is set"; exit 1
          fi

      - name: Run backfill pipeline
        run: |
          ARGS=""
          [ -n "${{ inputs.start_date }}" ] && \
            ARGS="$ARGS --start ${{ inputs.start_date }} --end ${{ inputs.end_date }}"
          [ "${{ inputs.no_upload }}"   = "true" ] && ARGS="$ARGS --no-upload"
          [ "${{ inputs.full_upload }}" = "true" ] && ARGS="$ARGS --full-upload"
          echo "python scripts/backfill_pipeline.py $ARGS"
          python scripts/backfill_pipeline.py $ARGS

      - name: Commit backfilled data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/lahore/lahore_features_hourly.csv

          if git diff --staged --quiet; then
            echo "No backfilled data to commit."
            exit 0
          fi

          git commit -m "chore: backfill $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"

          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep $((5 * i))
          done
          echo "::error::Failed to push after 3 attempts"
          exit 1
