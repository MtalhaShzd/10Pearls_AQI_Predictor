name: Backfill Pipeline (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-backfill-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file
        run: |
          echo "HOPSWORKS_API_KEY=${{ secrets.HOPSWORKS_API_KEY }}" >> .env
          echo "HOPSWORKS_PROJECT=internship10P" >> .env

      - name: Run backfill pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: internship10P
        run: python scripts/backfill_pipeline.py

      - name: Commit backfilled data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/processed/lahore/lahore_features_hourly.csv

          if ! git diff --staged --quiet; then
            git commit -m "chore: backfill data update $(date -u +'%Y-%m-%d %H:%M:%S UTC') [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          else
            echo "No backfilled data changes to commit."
          fi
